<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><style>
:root{color-scheme:light dark}body{margin:0;padding:10px 12px;font:14px/1.55 system-ui,sans-serif;color:var(--tg-theme-text-color)}.title{font-size:16px;font-weight:700;margin:0 0 8px}.hint{color:var(--tg-theme-hint-color);margin:0 0 10px}.link,.status{padding:8px 10px;border-radius:10px;background:var(--tg-theme-secondary-bg-color);margin:7px 0}.link{color:var(--tg-theme-hint-color)}.status{min-height:20px}button{width:100%;border:0;border-radius:10px;padding:10px 12px;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color);font:700 14px system-ui,sans-serif}button:disabled{opacity:.55}.progress{height:5px;border-radius:5px;background:var(--tg-theme-secondary-bg-color);overflow:hidden;margin:8px 0}.progress i{display:block;width:35%;height:100%;background:var(--tg-theme-button-color);animation:move 1.2s ease-in-out infinite}.hidden{display:none}.foot{font-size:11px;color:var(--tg-theme-hint-color);margin:8px 0 0}@keyframes move{0%{transform:translateX(290%)}100%{transform:translateX(-290%)}}
</style><div class="title">تنزيل فيديو TikTok</div><p class="hint">أرسل رابط TikTok كرسالة في هذه المحادثة؛ لا يمكن الكتابة داخل الـWidget.</p><div id="link" class="link">بانتظار رابط فيديو…</div><div id="status" class="status">أرسل رابطًا عامًا لبدء التنزيل.</div><div id="progress" class="progress hidden"><i></i></div><button id="download" disabled>بانتظار الرابط</button><p class="foot">سيُرسل ملف MP4 هنا في المحادثة.</p><script>
(()=>{const w=window.TelegramWidget,b=document.getElementById('download'),l=document.getElementById('link'),s=document.getElementById('status'),p=document.getElementById('progress');const busy=['queued','extracting','downloading'];function parse(v){try{return typeof v==='string'?JSON.parse(v):(v||{})}catch(_){return{}}}function render(v){const x=parse(v),k=x.status||'waiting_link',m={waiting_link:'أرسل رابط فيديو TikTok في المحادثة.',ready:'تم استلام الرابط. اضغط لتنزيله.',queued:'جارٍ تجهيز طلب التنزيل…',extracting:'جارٍ استخراج الفيديو من TikTok…',downloading:'تم العثور على الفيديو؛ جارٍ تنزيل MP4…',complete:'اكتمل التنزيل وأُرسل ملف MP4 في المحادثة.',error:x.message||'تعذر التنزيل. يمكنك إعادة المحاولة.'};s.textContent=m[k]||m.waiting_link;l.textContent=k==='ready'||k==='queued'||k==='extracting'||k==='downloading'?'رابط TikTok جاهز للتنزيل':'رابط الفيديو';p.classList.toggle('hidden',!busy.includes(k));b.disabled=!(k==='ready'||(k==='error'&&x.retry));b.textContent=k==='error'?'إعادة المحاولة':k==='complete'?'تم الإرسال':'تنزيل MP4 الآن'}if(w){w.onEvent('chatDataChanged',()=>render(w.chatData));render(w.chatData);w.ready()}else{s.textContent='افتح هذا العنصر داخل Telegram.'}b.addEventListener('click',()=>{if(!w)return;b.disabled=true;s.textContent='جارٍ إرسال طلب التنزيل…';p.classList.remove('hidden');const pending=w.request('download');pending.then(a=>{if(a&&a.result)render(a.result)},e=>{p.classList.add('hidden');s.textContent='تعذر الاتصال بالبوت ('+(e.code||'FAILED')+'). أعد المحاولة.';b.disabled=false})})})();
</script></html>
